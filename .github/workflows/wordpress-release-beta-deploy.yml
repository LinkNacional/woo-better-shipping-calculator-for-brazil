name: Beta release - deploy to WordPress.org (manual)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Versão/tag para o deploy (ex.: 4.17.2)'
        required: true
        default: '4.17.2'

env:
  PLUGIN_NAME: woo-better-shipping-calculator-for-brazil
  PHP_VERSION: "7.4"

jobs:
  deploy-to-wp:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout branch release-candidate-beta-test
      uses: actions/checkout@v3
      with:
        ref: release-candidate-beta-test

    - name: Run composer install
      uses: php-actions/composer@v6
      with:
        php_version: ${{ env.PHP_VERSION }}
        working_dir: "."
        args: --ignore-platform-reqs
        command: install
        dev: no

    - name: Prepare plugin folder
      run: |
        mkdir -p build/${{ env.PLUGIN_NAME }}
        mv ./Admin ./Includes ./languages ./Public *.php *.txt ./build/${{ env.PLUGIN_NAME }}
        rm -f ./build/${{ env.PLUGIN_NAME }}/wp-tests-config.php ./build/${{ env.PLUGIN_NAME }}/psalm-stubs.php
        cp -r vendor build/${{ env.PLUGIN_NAME }}/vendor
        find ./build -type f -exec chmod 0644 {} +
        find ./build -type d -exec chmod 0755 {} +

    - name: Deploy para WordPress.org
      uses: 10up/action-wordpress-plugin-deploy@stable
      env:
        VERSION: ${{ github.event.inputs.version }}
        SLUG: ${{ env.PLUGIN_NAME }}
        SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
        SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
        ASSETS_DIR: build/${{ env.PLUGIN_NAME }}/Includes/assets/wordpressAssets
        BUILD_DIR: build/${{ env.PLUGIN_NAME }}
